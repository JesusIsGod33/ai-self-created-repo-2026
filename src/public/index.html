<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Evidence-grounded career profile and resume studio"><title>Grounded Career Studio</title><link rel="stylesheet" href="/styles.css"></head>
<body><header class="topbar"><div class="container"><p class="eyebrow">CAREER WORKSPACE</p><h1>Grounded Career Studio</h1><p class="subtitle">Build job-aligned drafts from verified evidence. Your facts stay yours.</p></div></header>
<main class="container layout"><section class="panel" aria-labelledby="profile-heading"><div class="section-heading"><div><p class="eyebrow">YOUR SOURCE OF TRUTH</p><h2 id="profile-heading">Master profile</h2></div><span class="badge" id="verified-count">Loading…</span></div><div id="profile-content" class="stack" aria-live="polite"></div></section>
<section class="panel" aria-labelledby="alignment-heading"><p class="eyebrow">TARGET ROLE</p><h2 id="alignment-heading">Job alignment &amp; tailored draft</h2><label for="job-description">Job description</label><textarea id="job-description" rows="9" placeholder="Paste the job description here…"></textarea><div class="actions"><button id="analyze-btn" type="button">Analyze alignment</button><button id="tailor-btn" type="button" class="secondary">Build tailored draft</button><label class="export-control">Export <select id="export-format"><option value="text">Plain text</option><option value="markdown">Markdown</option><option value="json">JSON bundle</option><option value="audit">Audit report</option></select></label><button id="export-btn" type="button" class="secondary">Download</button></div><p id="status" role="status" aria-live="polite"></p><div id="alignment-output" class="stack"></div><div id="draft-output" class="stack"></div><div id="ats-output" class="stack"></div></section></main><script type="module" src="/app.js"></script></body></html>
